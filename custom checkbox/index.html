<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./assets/icon_download.png">
    <title>Custom checkbox</title>
    <link rel="stylesheet" href="./index.css">
    <title>practice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --primary: blue;
            --secondary: gray;
            --bg: rgb(234, 239, 244);
            --text: black;
        }
        :root[data-theme="dark"]{
            --primary: blue;
            --secondary: gray;
            --bg: rgb(23, 23, 24);
            --text: #ffffff;
        }
         body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0px;
            padding: 10px;
            min-height: 100vh;
        }

        /*checkbox style*/
        .toggle {
            position: relative;
            width: 80px;
            height: 40px;
        }

        .track {
            position: absolute;
            inset: 0;
            border-radius: 30px;
            background: #e0e5ec;
            box-shadow: inset 6px 6px 10px #b8bec7, inset -6px -6px 10px #ffffff;
        }

        .thumb {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #e8eff6;
            cursor: pointer;
            box-shadow: 4px 4px 8px #b8bec7, -4px -4px 8px #ffffff;
            transition: left 0.3s ease;
        }

        input {
            visibility: hidden;
        }

        input:checked~.thumb {
            left: 46px;
            background-color: black
        }

        input:not(:checked)~.track {
            box-shadow: 4px 4px 7.5px #b8bec7, -4px -4px 7.5px #ffffff;
        }
    </style>
</head>

<body>
    <div class="d-flex flex-row justify-content-center align-items-center">
        <label class="toggle">
            <input id="checkbox" type="checkbox" />
            <div class="track"></div>
            <div class="thumb"></div>
        </label>
    </div>
    <br />
    <div class="text-center">
        Sumanth Palliboina
    </div>
    <script type="text/javascript" src="./index.js"></script>
</body>

</html>
