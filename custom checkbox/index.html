<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./assets/icon_download.png">
    <title>Custom checkbox</title>
    <style>
        /*checkbox style*/
        .toggle{
            position: relative;
            width: 80px;
            height: 40px;
        }
        .track{
            position: absolute;
            inset: 0;
            border-radius: 30px;
            background:#e0e5ec;
            box-shadow: inset 6px 6px 10px #b8bec7, inset -6px -6px 10px #ffffff;
        }
        .thumb{
            position:absolute;
            top:5px;
            left: 5px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #e8eff6;
            cursor:pointer;
            box-shadow: 4px 4px 8px #b8bec7, -4px -4px 8px #ffffff;
            transition: left 0.3s ease;
        }
        input{
            visibility: hidden;
        }
        input:checked~.thumb{
            left: 46px;
            background-color: black
        }
        input:not(:checked)~.track{
            box-shadow: 4px 4px 7.5px #b8bec7, -4px -4px 7.5px #ffffff;
        }
        body{
            background-color: rgb(234, 239, 244);
            margin: 0px;
            padding: 10px;
            min-height: 100vh;
        }
    </style>
    <link rel="stylesheet" href="./index.css">
    <title>practice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="d-flex flex-row justify-content-center align-items-center">
    <label class="toggle">
        <input type="checkbox" />
        <div class="track"></div>
        <div class="thumb"></div>
    </label>
</body>
</html>
